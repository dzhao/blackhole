[package]
name = "blackhole_server"
version = "0.1.0"
edition = "2021"

[dependencies]
# rocksdb = "0.22"
rocksdb = { git = "https://github.com/dzhao/rust-rocksdb.git", branch = "capped" }
criterion = "0.5"
rand = "0.8"
lmdb = "0.8"
histogram = "0.11"
murmur3 = "0.5"
arrow = "54.0"
arrow-flight = "54.0"
futures = "0.3"
tonic = "0.12"
tokio = { version = "1.35", features = ["full"] }
bytes = "1.8"
clap = { version = "4.4", features = ["derive"] }
lazy_static = "1.5"
flatbuffers = "24.12"  # or your preferred version
serde_json = "1.0"
blackhole_client = { path = "../client" }
[[bench]]
name = "rocksdb_benchmarks"
harness = false

[[bench]]
name = "lmdb_benchmarks"
harness = false

[[bin]]
name = "perf_test"
path = "src/perf_test/main.rs"

[[bin]]
name = "training"
path = "src/training/main.rs"

[build-dependencies]
flatc-rust = "0.2.0"

[lib]
name = "blackhole_lib"
path = "src/lib.rs"
